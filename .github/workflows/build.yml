name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MSF-RamadanulMubarak-Record-APK
          path: app/build/outputs/apk/debug/*.apk

      # Profile + icons ka source code bhi alag artifact me
      - name: Collect profile and icons code
        run: |
          mkdir -p profile-icons-code/res
          cp app/src/main/java/com/msf/ramadanrecord/ProfileActivity.kt profile-icons-code/
          cp app/src/main/java/com/msf/ramadanrecord/SettingsUi.kt profile-icons-code/
          cp -r app/src/main/res/drawable profile-icons-code/res/
          cp -r app/src/main/res/drawable-nodpi profile-icons-code/res/
          cp -r app/src/main/res/mipmap-* profile-icons-code/res/
      - uses: actions/upload-artifact@v4
        with:
          name: MSF-Profile-and-Icons-Code
          path: profile-icons-code
