name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Find project folder
        id: p
        run: |
          f=$(find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            z=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -1)
            if [ -n "$z" ]; then
              echo "zip mili: $z - extract kar raha hoon"
              mkdir -p _unzipped && unzip -q -o "$z" -d _unzipped
              f=$(find _unzipped -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
            fi
          fi
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts repo me nahi mili. Files ki fehrist:"
            find . -maxdepth 3 -not -path './.git*' | sort
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: App-APK
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
