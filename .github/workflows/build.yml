name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Find project folder
        id: p
        run: |
          echo "=== repo files ==="
          find . -maxdepth 3 -not -path './.git*' | sort
          f=$(find . -maxdepth 3 \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -1)
          echo "found: [$f]"
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: App-APK
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
