import 'package:flutter/material.dart';

void main() {
  runApp(const ZindagiKiUsoolApp());
}

class ZindagiKiUsoolApp extends StatelessWidget {
  const ZindagiKiUsoolApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'زندگی کے اصول',
      theme: ThemeData(
        brightness: Brightness.dark,
        scaffoldBackgroundColor: const Color(0xFF121212),
        primaryColor: const Color(0xFFD4AF37), // Gold color
        colorScheme: ColorScheme.dark(
          primary: const Color(0xFFD4AF37),
          secondary: const Color(0xFFC5A059),
          surface: const Color(0xFF1E1E1E),
        ),
      ),
      home: const HomeScreen(),
    );
  }
}

class HomeScreen extends StatelessWidget {
  const HomeScreen({super.key});

  final List<String> usoolList = const [
    "سچائی اور دیانت داری ہی بہترین حکمتِ عملی ہے۔",
    "صبر وہ قیمتی ہیرہ ہے جو انسان کو ہر مشکل میں سنبھالتا ہے۔",
    "وقت کی قدر کریں، گزرا ہوا وقت کبھی واپس نہیں آتا۔",
    "اپنے والدین کا احترام اور خدمت دونوں کامیابی کی کنجی ہیں۔",
    "مایوسی کفر ہے، ہمیشہ اللہ کی رحمت پر یقین رکھیں۔",
  ];

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text(
          'زندگی کے اصول',
          style: TextStyle(
            color: Color(0xFFD4AF37),
            fontWeight: FontWeight.bold,
          ),
        ),
        centerTitle: true,
        backgroundColor: const Color(0xFF1A1A1A),
        elevation: 0,
      ),
      body: ListView.builder(
        padding: const EdgeInsets.all(16.0),
        itemCount: usoolList.length,
        itemBuilder: (context, index) {
          return Container(
            margin: const EdgeInsets.only(bottom: 15.0),
            padding: const EdgeInsets.all(16.0),
            decoration: BoxDecoration(
              color: const Color(0xFF1E1E1E),
              borderRadius: BorderRadius.circular(12.0),
              border: Border.all(
                color: const Color(0xFFD4AF37).withOpacity(0.5),
                width: 1.0,
              ),
            ),
            child: Row(
              children: [
                const Icon(
                  Icons.format_quote,
                  color: Color(0xFFD4AF37),
                  size: 28,
                ),
                const SizedBox(width: 12),
                Expanded(
                  child: Text(
                    usoolList[index],
                    style: const TextStyle(
                      color: Colors.white,
                      fontSize: 16,
                      height: 1.5,
                    ),
                  ),
                ),
              ],
            ),
          );
        },
