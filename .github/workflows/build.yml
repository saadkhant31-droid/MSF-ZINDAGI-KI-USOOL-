name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -o "$z" -d extracted_zip; done
          INDEX=$(find . -name index.html -not -path "./node_modules/*" -not -path "./www/*" -not -path "./android/*" | head -n 1)
          if [ -z "$INDEX" ]; then echo "index.html کہیں نہیں ملی"; ls -R; exit 1; fi
          SRC=$(dirname "$INDEX")
          echo "App folder: $SRC"
          mkdir -p www
          if [ "$SRC" = "." ]; then
            cp -r index.html manifest.json sw.js favicon.png icons www/
          else
            cp -r "$SRC"/. www/
          fi
          ls -R www | head -30

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "MSF Zindagi Ki Usool" com.msf.zindagikiusool --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSF-Zindagi-Ki-Usool-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
